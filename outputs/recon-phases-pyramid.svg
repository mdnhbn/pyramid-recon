<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2280" viewBox="0 0 1600 2280" role="img" aria-labelledby="title desc">
  <title id="title">Web App Recon Tool — Phase 0 to Phase 9 Pyramid</title>
  <desc id="desc">A ten-stage authorized web reconnaissance workflow pyramid. Phase 0 is the apex and Phase 9 is the base, followed sequentially by a Python web app architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#101e32"/>
    </linearGradient>
    <linearGradient id="p0" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37d6c0"/><stop offset="1" stop-color="#64e3a7"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39c9c3"/><stop offset="1" stop-color="#57d8a5"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49b9d1"/><stop offset="1" stop-color="#64cda7"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#589fd8"/><stop offset="1" stop-color="#65bea8"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#668cda"/><stop offset="1" stop-color="#83b2b2"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#827fdb"/><stop offset="1" stop-color="#a5a5b2"/></linearGradient>
    <linearGradient id="p6" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9a77d5"/><stop offset="1" stop-color="#c09a9f"/></linearGradient>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b274c7"/><stop offset="1" stop-color="#d29b8f"/></linearGradient>
    <linearGradient id="p8" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ca79ac"/><stop offset="1" stop-color="#e0a17f"/></linearGradient>
    <linearGradient id="p9" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#df898e"/><stop offset="1" stop-color="#edb36f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".32"/></filter>
    <style>
      text { font-family: "Nirmala UI", "Noto Sans Bengali", "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill:#67dec7; font-size:20px; font-weight:700; letter-spacing:4px; }
      .title { fill:#f3f7fb; font-size:52px; font-weight:750; letter-spacing:-1px; }
      .subtitle { fill:#aebdcc; font-size:25px; }
      .phase { fill:#0b1725; font-size:25px; font-weight:750; }
      .detail { fill:#162536; font-size:17px; font-weight:550; }
      .num { fill:#f5fbff; font-size:30px; font-weight:800; }
      .section { fill:#edf4fb; font-size:25px; font-weight:750; }
      .small { fill:#aebdcc; font-size:17px; }
      .boxhead { fill:#edf5fc; font-size:17px; font-weight:700; }
      .boxsub { fill:#aab9c8; font-size:14px; }
    </style>
  </defs>
  <rect width="1600" height="2280" fill="url(#bg)"/>
  <circle cx="1440" cy="155" r="180" fill="#43d4bd" opacity=".055"/>
  <circle cx="180" cy="1120" r="250" fill="#9679df" opacity=".045"/>

  <text x="100" y="90" class="eyebrow">AUTHORIZED WEB RECONNAISSANCE</text>
  <text x="100" y="166" class="title">Web App Recon Tool</text>
  <text x="100" y="214" class="subtitle">Phase 0 → 9 · Python backend · serial workflow</text>
  <rect x="100" y="252" width="1400" height="76" rx="18" fill="#14273a" stroke="#29445c"/>
  <circle cx="137" cy="290" r="10" fill="#54dcb9"/>
  <text x="164" y="298" fill="#d9e6ef" font-size="19" font-weight="650">One authorized domain → one phase at a time → reviewable report</text>
  <text x="1460" y="298" text-anchor="end" fill="#84a0b4" font-size="17">TOP: 0</text>

  <text x="800" y="390" text-anchor="middle" fill="#74dfc7" font-size="16" font-weight="750" letter-spacing="3">DISCOVER → VERIFY → MAP → REVIEW</text>
  <line x1="800" y1="404" x2="800" y2="426" stroke="#4cd7b9" stroke-width="3" opacity=".65"/>
  <path d="M792 420 L800 430 L808 420" fill="none" stroke="#4cd7b9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pyramid tiers: Phase 0 at the apex, Phase 9 at the base. -->
  <g filter="url(#shadow)">
    <polygon points="520,456 1080,456 1095,568 505,568" fill="url(#p0)"/>
    <polygon points="475,580 1125,580 1140,692 460,692" fill="url(#p1)"/>
    <polygon points="430,704 1170,704 1185,816 415,816" fill="url(#p2)"/>
    <polygon points="385,828 1215,828 1230,940 370,940" fill="url(#p3)"/>
    <polygon points="340,952 1260,952 1275,1064 325,1064" fill="url(#p4)"/>
    <polygon points="295,1076 1305,1076 1320,1188 280,1188" fill="url(#p5)"/>
    <polygon points="250,1200 1350,1200 1365,1312 235,1312" fill="url(#p6)"/>
    <polygon points="205,1324 1395,1324 1410,1436 190,1436" fill="url(#p7)"/>
    <polygon points="160,1448 1440,1448 1455,1560 145,1560" fill="url(#p8)"/>
    <polygon points="115,1572 1485,1572 1500,1684 100,1684" fill="url(#p9)"/>
  </g>

  <g>
    <text x="545" y="496" class="num">0</text><text x="600" y="492" class="phase">Scope &amp; Setup</text><text x="600" y="525" class="detail">Permission · allowlist · limits · tool readiness</text>
    <text x="500" y="620" class="num">1</text><text x="555" y="616" class="phase">Passive Recon &amp; OSINT</text><text x="555" y="649" class="detail">Public domain, DNS, ASN and registration data</text>
    <text x="455" y="744" class="num">2</text><text x="510" y="740" class="phase">Subdomain Discovery</text><text x="510" y="773" class="detail">Passive sources first · controlled DNS checks</text>
    <text x="410" y="868" class="num">3</text><text x="465" y="864" class="phase">Live Host Verification</text><text x="465" y="897" class="detail">Check in-scope HTTP/HTTPS hosts and response metadata</text>
    <text x="365" y="992" class="num">4</text><text x="420" y="988" class="phase">Technology Fingerprinting</text><text x="420" y="1021" class="detail">Identify framework, CMS, server and client libraries</text>
    <text x="320" y="1116" class="num">5</text><text x="375" y="1112" class="phase">Content &amp; Directory Discovery</text><text x="375" y="1145" class="detail">Low-rate, scoped path discovery · no credential guessing</text>
    <text x="275" y="1240" class="num">6</text><text x="330" y="1236" class="phase">URL &amp; Endpoint Discovery</text><text x="330" y="1269" class="detail">Public archives + scoped crawl · deduplicate URLs</text>
    <text x="230" y="1364" class="num">7</text><text x="285" y="1360" class="phase">JavaScript Analysis</text><text x="285" y="1393" class="detail">Extract endpoint clues · redact secrets from reports</text>
    <text x="185" y="1488" class="num">8</text><text x="240" y="1484" class="phase">Parameter Discovery</text><text x="240" y="1517" class="detail">Build an endpoint/parameter inventory · testing requires approval</text>
    <text x="140" y="1612" class="num">9</text><text x="195" y="1608" class="phase">Vulnerability Scanning</text><text x="195" y="1641" class="detail">Conservative checks on allowlisted assets · findings need human review</text>
  </g>

  <text x="800" y="1730" text-anchor="middle" fill="#e0eaf2" font-size="16" font-weight="700" letter-spacing="2">BOTTOM: 9 · STOP AFTER EACH PHASE IF SCOPE OR SAFETY CHECK FAILS</text>

  <text x="100" y="1810" class="section">Python online tool · backend flow</text>
  <text x="100" y="1844" class="small">The web interface submits a job; a single worker advances phases in order and saves each artifact.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="1890" width="300" height="136" rx="18" fill="#162b3f" stroke="#2a465c"/>
    <rect x="460" y="1890" width="300" height="136" rx="18" fill="#162b3f" stroke="#2a465c"/>
    <rect x="820" y="1890" width="340" height="136" rx="18" fill="#162b3f" stroke="#2a465c"/>
    <rect x="1220" y="1890" width="280" height="136" rx="18" fill="#162b3f" stroke="#2a465c"/>
  </g>
  <text x="250" y="1942" text-anchor="middle" class="boxhead">Web UI</text>
  <text x="250" y="1973" text-anchor="middle" class="boxsub">domain · scope · consent</text>
  <text x="610" y="1942" text-anchor="middle" class="boxhead">FastAPI</text>
  <text x="610" y="1973" text-anchor="middle" class="boxsub">validate · create job</text>
  <text x="990" y="1942" text-anchor="middle" class="boxhead">Python serial worker</text>
  <text x="990" y="1973" text-anchor="middle" class="boxsub">phase 0 → 1 → … → 9</text>
  <text x="1360" y="1942" text-anchor="middle" class="boxhead">Results</text>
  <text x="1360" y="1973" text-anchor="middle" class="boxsub">artifacts · report · audit log</text>
  <path d="M410 1958 H448 M770 1958 H808 M1170 1958 H1208" stroke="#57d9bd" stroke-width="3"/>
  <path d="M440 1950 L450 1958 L440 1966 M800 1950 L810 1958 L800 1966 M1200 1950 L1210 1958 L1200 1966" fill="none" stroke="#57d9bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="2070" width="1400" height="112" rx="18" fill="#11263a" stroke="#28475c"/>
  <text x="136" y="2114" fill="#67dec7" font-size="17" font-weight="750">SAFETY GATE</text>
  <text x="136" y="2147" fill="#c2d0dc" font-size="17">Verify written authorization and exact scope before active phases; rate-limit requests, stop on errors, never exploit or dump data.</text>
  <text x="1500" y="2232" text-anchor="end" fill="#788da2" font-size="14">Concept map based on the open “Recon for Web Application” page · adapted for authorized assessment</text>
</svg>
